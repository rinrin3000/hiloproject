<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17130f">
<title>Habla — Hilo.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17130f;--card:#221c17;--card2:#2c241d;--line:#3a3028;--text:#f0e7d8;--dim:#9c8f7e;
  --grana:#d9574a;--anil:#7fa6d6;--oro:#e2a83f;--verde:#7fb36a;--gap:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;
  min-height:100vh;padding:0 var(--gap) 90px}
a{color:var(--anil)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;max-width:640px;margin:0 auto}
.pill{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px;color:var(--text);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:3px 13px 4px;background:var(--card)}
.pill b{color:var(--grana)}
.apptitle{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.tabs{display:flex;gap:6px;max-width:640px;margin:0 auto 14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
.tabs button.on{background:var(--grana);border-color:var(--grana);color:#fff}
main{max-width:640px;margin:0 auto}
button{background:var(--card2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
  padding:9px 14px;border-radius:999px;cursor:pointer}
button:active{border-color:var(--grana)}
button.big{font-size:16px;padding:13px 18px;border-radius:14px}
button.pri{background:var(--grana);border-color:var(--grana);color:#fff}
button.ghost{background:none}
button:disabled{opacity:.4}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sec{font-size:11px;color:var(--anil);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 8px}
.dim{color:var(--dim)}
.note{color:var(--dim);font-size:13px;line-height:1.7;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 11px;font-size:13px}
.chips button.on{border-color:var(--oro);color:var(--oro)}
.es{font-family:'Fraunces',Georgia,serif}
.tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.star{background:none;border:none;font-size:20px;color:var(--oro);padding:4px 8px}
select,textarea,input[type=number],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;max-width:100%}
textarea{width:100%;min-height:90px}
input[type=range]{width:100%;accent-color:var(--grana)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--oro);
  color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.hide{display:none!important}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
@media (max-width:420px){button{padding:8px 11px}.apptitle{font-size:19px}}

.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 18px;min-height:320px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px}
.cue{font-size:22px;line-height:1.4}
.cue .note2{display:block;font-size:13px;color:var(--dim);margin-top:6px}
.ans{font-family:'Fraunces',Georgia,serif;font-size:27px;line-height:1.35;min-height:1.4em}
.ans.wait{color:var(--line)}
.phase{font-size:11px;letter-spacing:.16em;color:var(--anil);text-transform:uppercase}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--oro)}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:14px}
.ctl button{font-size:18px;padding:12px 18px;border-radius:14px}
.slot{color:var(--grana);font-weight:600}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.lh .t{flex:1}.lh b{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
.lh .c{font-size:12px;color:var(--dim)}
.lb{border-top:1px solid var(--line);padding:4px 12px 10px}
.d{padding:10px 0;border-bottom:1px solid var(--line)}
.d:last-child{border-bottom:none}
.d .es{font-size:17px}
.d .en{font-size:13px;color:var(--dim)}
.d .sw{font-size:13px;color:var(--dim);margin-top:4px}
.d .sw span{display:inline-block;background:var(--card2);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;color:var(--text);cursor:pointer}
.dots{font-size:11px;color:var(--verde);letter-spacing:2px}
.card2{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;min-height:280px;display:flex;flex-direction:column}
.card2 .front{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--grana)}
</style>
</head>
<body>
<div class="top"><a class="pill" href="index.html">Hilo<b>.</b></a><span class="apptitle">Habla</span></div>
<div class="tabs" id="tabs">
  <button data-t="manos" class="on">Manos libres</button><button data-t="tarjetas">Tarjetas</button><button data-t="lista">Lista</button><button data-t="ajustes">Ajustes</button>
</div>
<main id="main"></main>
<script>
(function(){
/* ===== Hilo core (inlined into every app, inside the app's IIFE) ===== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=864e5, now=()=>Date.now();
const eod=()=>{const d=new Date();d.setHours(24,0,0,0);return d.getTime();};   // next local midnight
const sod=()=>eod()-DAY;
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||2200);}
function load(key,def){try{const v=JSON.parse(localStorage.getItem(key));return v&&typeof v==="object"?Object.assign(def,v):def;}catch(e){return def;}}
function store(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));return true;}catch(e){toast("Could not save progress (storage blocked?)");return false;}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* shared "my lesson" across the three apps */
function getLevel(){try{const v=parseInt(localStorage.getItem("hilo_level"));return v>0?v:1;}catch(e){return 1;}}
function setLevel(n){try{localStorage.setItem("hilo_level",String(n));}catch(e){}}

/* ===== robust TTS (Ito's 文型 engine, adapted for Spanish) ===== */
const TTSCFG={esURI:"",enURI:""};
let ESV=null,ENV=null,unlocked=false,speakToken=0,noEs=false,voicesSettled=false,currentU=null;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
const isEs=v=>v.lang.replace("_","-").toLowerCase().startsWith("es");
function pickVoices(){const vs=allVoices();
  const lat=v=>/es-(mx|us|419|co|ar|cl|pe)/i.test(v.lang.replace("_","-"));
  ESV=(TTSCFG.esURI&&vs.find(v=>v.voiceURI===TTSCFG.esURI))
    ||vs.find(v=>/Google/i.test(v.name)&&lat(v))
    ||vs.find(v=>/Paulina|Juan|Sabina|Dalia|Jorge/i.test(v.name)&&isEs(v))
    ||vs.find(v=>lat(v))||vs.find(v=>/Google/i.test(v.name)&&isEs(v))||vs.find(isEs)||null;
  ENV=(TTSCFG.enURI&&vs.find(v=>v.voiceURI===TTSCFG.enURI))
    ||vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>v.lang.startsWith("en"))||null;
  noEs=vs.length>0&&!ESV;}
async function ensureVoices(){for(let i=0;i<20;i++){if(allVoices().length)break;await new Promise(r=>setTimeout(r,120));}
  pickVoices();voicesSettled=true;}
function esWarnHTML(){return `<div class="box" id="es-warn" style="border-color:var(--grana)">
  ⚠ <b>No Spanish voice found in this browser.</b> Audio will be silent until one is installed.
  <div class="note">• <b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Spanish (Mexico) → <b>Paulina</b><br>
  • <b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage voices → Spanish<br>
  • <b>Windows:</b> Settings → Time &amp; Language → Language → add Español (México) with speech, or use Chrome/Edge<br>
  • <b>Android:</b> Settings → Google Text-to-speech → install Spanish<br>Then reload.</div></div>`;}
if(typeof speechSynthesis!=="undefined"){speechSynthesis.onvoiceschanged=()=>pickVoices();pickVoices();
  ensureVoices().then(()=>{const m=$("main");if(noEs&&m&&!$("#es-warn"))m.insertAdjacentHTML("afterbegin",esWarnHTML());});}
function unlock(){if(unlocked)return;unlocked=true;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("a");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener("touchstart",unlock,{once:true});
document.addEventListener("click",unlock,{once:true});
function stopSpeech(){speakToken++;try{speechSynthesis.cancel();}catch(e){}}
/* speak(text, "es"|"en", rate, {pitch}) → Promise resolved when done (or watchdog fires) */
function speak(text,lang="es",rate=0.95,opt={},_retry=false){
  const myToken=++speakToken, es=lang==="es";
  text=String(text).replace(/[—«»]/g," ").replace(/\s+/g," ").trim();
  if(!text)return Promise.resolve();
  return new Promise(async res=>{
    try{
      if(typeof speechSynthesis==="undefined")return res();
      if(!voicesSettled)await ensureVoices();
      const busy=speechSynthesis.speaking||speechSynthesis.pending;
      if(busy)speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken!==speakToken)return res();
        pickVoices();
        const u=new SpeechSynthesisUtterance(text);currentU=u;
        u.lang=es?(ESV?ESV.lang:"es-MX"):"en-US";
        let v=es?ESV:ENV,r=es?rate:1.0;
        if(_retry){r=1.0;if(es){const alt=allVoices().find(x=>isEs(x)&&v&&x.localService!==v.localService);if(alt)v=alt;}}
        if(v)u.voice=v;
        u.rate=Math.max(0.6,r);u.pitch=opt.pitch||1;
        let done=false,started=false;
        const kick=setInterval(()=>{try{speechSynthesis.resume()}catch(e){}},2500);
        const finish=()=>{if(done)return;done=true;clearInterval(kick);res();};
        u.onstart=()=>{started=true};u.onend=finish;u.onerror=finish;
        setTimeout(finish,600+text.length*(es?80:75)/u.rate+1500);
        setTimeout(()=>{if(!started&&!done&&!_retry){done=true;clearInterval(kick);try{speechSynthesis.cancel()}catch(e){}
          setTimeout(()=>speak(text,lang,1.0,opt,true).then(res),160);}},1400);
        speechSynthesis.speak(u);
        setTimeout(()=>{try{speechSynthesis.resume()}catch(e){}},120);
      },busy?230:40);
    }catch(e){res();}
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* voice settings block (rendered inside each app's settings tab) */
function voiceUI(cfg,saveFn){
  const vs=allVoices();
  const opts=(f,cur)=>`<option value="">Automatic</option>`+vs.filter(f).map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===cur?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  return `<div class="kv"><span>Spanish voice</span><select id="v-es">${opts(isEs,cfg.esURI)}</select></div>
   <div class="kv"><span>English voice</span><select id="v-en">${opts(v=>v.lang.startsWith("en"),cfg.enURI)}</select></div>
   <div class="row" style="margin-top:10px"><button id="v-test">🔊 Test</button><button id="v-reset">Reset audio</button></div>`;}
function bindVoiceUI(cfg,saveFn){
  const a=$("#v-es"),b=$("#v-en");if(!a)return;
  a.onchange=()=>{cfg.esURI=a.value;TTSCFG.esURI=a.value;saveFn();pickVoices();speak("Hola, ¿qué tal?","es");};
  b.onchange=()=>{cfg.enURI=b.value;TTSCFG.enURI=b.value;saveFn();pickVoices();speak("Hello!","en");};
  $("#v-test").onclick=()=>speak("Hola, me llamo Kenji. ¿Cómo te llamas?","es");
  $("#v-reset").onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}setTimeout(()=>speak("Listo.","es"),250);};}

/* ===== backup: copy / paste with per-app merge (shared with the hub) ===== */
const BKEYS=["palabras_v1","habla_v1","lectura_v1","hilo_level"];
const newer=(a,b)=>(!a?b:!b?a:((b.at||0)>(a.at||0)?b:a));
function mergeMapNewer(A,B){const o=Object.assign({},A||{});for(const k in (B||{}))o[k]=newer(o[k],B[k]);return o;}
function mergeKey(key,local,inc){
  if(key==="hilo_level")return Math.max(+local||1,+inc||1);
  if(!local)return inc; if(!inc)return local;
  const o=Object.assign({},local);
  if(key==="palabras_v1"){o.cards=mergeMapNewer(local.cards,inc.cards);o.miss=mergeMapNewer(local.miss,inc.miss);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="habla_v1"){o.d=mergeMapNewer(local.d,inc.d);o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="lectura_v1"){o.done=Object.assign({},inc.done||{},local.done||{});o.pos=mergeMapNewer(local.pos,inc.pos);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  return o;}
function exportJSON(keys){const out={hilo:1,at:new Date().toISOString(),keys:{}};
  keys.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)out.keys[k]=JSON.parse(v);}catch(e){}});return JSON.stringify(out);}
function importJSON(txt,keys){let d;try{d=JSON.parse(txt.trim());}catch(e){return "That doesn't look like a Hilo backup.";}
  if(!d||!d.keys)return "That doesn't look like a Hilo backup.";
  let n=0;keys.forEach(k=>{if(!(k in d.keys))return;let cur=null;try{cur=JSON.parse(localStorage.getItem(k));}catch(e){}
    const m=mergeKey(k,cur,d.keys[k]);try{localStorage.setItem(k,JSON.stringify(m));n++;}catch(e){}});
  return n?"":"Nothing in that backup belongs to this app.";}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}}
function backupUI(){return `<div class="row"><button id="bk-copy">📋 Copy progress</button><button id="bk-paste">📥 Paste progress</button></div>
  <div id="bk-area" class="hide" style="margin-top:10px"><textarea id="bk-text" placeholder="Paste a Hilo backup here"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" id="bk-go">Merge into this device</button><button id="bk-x">Cancel</button></div></div>
  <div class="note">Progress lives only in this browser. Copy it now and then (paste into a note or message to yourself) so a cleared browser or a new phone doesn't lose it. Pasting <b>merges</b>: the newer review of each card wins, nothing is deleted.</div>`;}
function bindBackupUI(keys,after){
  $("#bk-copy").onclick=async()=>{const t=exportJSON(keys);
    if(await copyText(t)){toast("Copied! Paste it somewhere safe.");after&&after("copied");}
    else{$("#bk-area").classList.remove("hide");$("#bk-text").value=t;$("#bk-text").select();toast("Select all and copy the text below.");}};
  $("#bk-paste").onclick=()=>{$("#bk-area").classList.remove("hide");$("#bk-text").value="";$("#bk-text").focus();};
  $("#bk-x").onclick=()=>$("#bk-area").classList.add("hide");
  $("#bk-go").onclick=()=>{const err=importJSON($("#bk-text").value,keys);if(err){toast(err);return;}
    toast("Merged ✓");setTimeout(()=>location.reload(),700);};}

const LESSONS={"1": ["Hola, ¿qué tal?", "ser (soy/eres/es/somos/son), subject pronouns, llamarse (me llamo, te llamas, se llama)"], "2": ["Personas y cosas", "gender & number, el/la/los/las, un/una, adjective agreement, ser + description"], "3": ["¿Dónde está?", "estar (location), hay, prepositions of place, ¿qué hay? vs ¿dónde está?"], "4": ["Mi día", "presente regular -ar/-er/-ir, negation no, question words"], "5": ["Mi familia", "tener (incl. age, tener que), possessives (mi/tu/su already seen in L2) + nuestro"], "6": ["Me gusta", "gustar (me/te/le/nos/les gusta(n)), también/tampoco, a mí sí/no"], "7": ["Mi rutina", "reflexive verbs (levantarse…), telling time, days of the week"], "8": ["Quiero, puedo", "stem-changing presente: e→ie (querer, pensar, empezar, preferir), o→ue (poder, dormir, volver, costar), e→i (pedir, repetir); querer/poder + infinitive"], "9": ["Hago, salgo, vengo", "irregular yo forms (hago, salgo, pongo, traigo, sé, conozco) + ir, venir, decir; saber vs conocer; weather hace calor"], "10": ["Voy a…", "ir a + infinitive (plans), time expressions (mañana, el fin de semana, la próxima semana), muy vs mucho"], "11": ["¿Cuánto cuesta?", "ser vs estar (traits vs states), estar + gerundio, demonstratives este/ese/aquel"], "12": ["Ayer…", "pretérito regular (-ar/-er/-ir) + fui (ir/ser), ayer, anoche, la semana pasada"], "13": ["¿Qué hiciste?", "pretérito irregular: tuve, estuve, hice, pude, puse, vine, dije, quise, supe; hace + time (= ago)"], "14": ["Lo veo", "direct object pronouns lo/la/los/las, placement (lo quiero comprar / quiero comprarlo)"], "15": ["Te lo doy", "indirect object pronouns, se lo double pronouns, dar, traer, prestar"], "16": ["Cuando era niño", "imperfecto (habits, description in the past)"], "17": ["Una historia", "pretérito vs imperfecto in narration (estaba … cuando …)"], "18": ["Más que…", "comparatives & superlatives (más/menos … que, tan … como, el más, mejor/peor, -ísimo)"], "19": ["¡Pasa!", "imperativo afirmativo (tú/usted/ustedes)"], "20": ["¡No lo toques!", "imperativo negativo + pronoun placement (dímelo / no me lo digas)"], "21": ["¿Alguna vez…?", "pretérito perfecto (he comido) for experience & ya / todavía no"], "22": ["Mañana será…", "futuro simple (predictions, guesses), por vs para basics"], "23": ["Me gustaría…", "condicional (me gustaría, podría, debería, ¿podrías…?)"], "24": ["Acabo de llegar", "verbal periphrases (acabar de, volver a, dejar de, seguir + gerundio, soler), estaba + gerundio"], "25": ["Quiero que vengas", "presente de subjuntivo (forms) + querer/necesitar que"], "26": ["Ojalá", "subjuntivo: wishes & emotions (ojalá, espero que, me alegra que, me molesta que)"], "27": ["Te recomiendo que…", "subjuntivo: advice & value judgments (es importante que, te recomiendo que, es mejor que)"], "28": ["No creo que…", "subjuntivo: doubt vs certainty (creo que + ind. / no creo que + subj., es posible que, quizás)"], "29": ["Cuando llegues", "cuando / hasta que / antes de que / para que + subjuntivo"], "30": ["Busco a alguien que…", "relative clauses (que, donde, lo que, quien) + subjuntivo in relatives"], "31": ["Ya había salido", "pluscuamperfecto (había hecho)"], "32": ["Me dijo que…", "reported speech (dijo que…, me preguntó si…)"], "33": ["Si tuviera tiempo…", "imperfecto de subjuntivo (forms) + quería que, me pidió que"], "34": ["Si pudiera…", "conditional sentences (si + presente → futuro/presente; si + imperfecto subj. → condicional)"], "35": ["Se me olvidó", "se: impersonal (se dice), passive (se venden), accidental (se me cayó)"], "36": ["Por eso", "connectors (aunque, sin embargo, por eso, así que, además, en cambio), review finale"]};

const KEY="habla_v1";
const S=load(KEY,{d:{},star:{},cfg:{},lastBackup:0});
S.cfg=Object.assign({lo:1,hi:getLevel(),src:"all",gap:1,rate:0.95,rounds:16,esURI:"",enURI:""},S.cfg||{});
TTSCFG.esURI=S.cfg.esURI;TTSCFG.enURI=S.cfg.enURI;
const save=()=>store(KEY,S);
const D={};DRILLS.forEach(d=>D[d.id]=d);
const LS=[...new Set(DRILLS.map(d=>d.L))].sort((a,b)=>a-b);
const maxL=LS[LS.length-1];
S.cfg.hi=Math.min(Math.max(S.cfg.hi,S.cfg.lo),maxL);S.cfg.lo=Math.min(S.cfg.lo,S.cfg.hi);
window.__habla={S,D};
/* variant v: -1 = anchor, i = swap i */
function fill(d,v){if(v<0)return{es:d.es.replace(/[【】]/g,""),en:d.en.replace(/\*/g,"")};
  const [a,b]=d.sw[v];return{es:d.es.replace(/【.*?】/,a),en:d.en.replace(/\*.*?\*/,b)};}
const cueText=en=>en.replace(/\(([^)]*)\)/g,"").replace(/\s+/g," ").trim();
const cueNote=en=>{const m=en.match(/\(([^)]*)\)/);return m?m[1]:"";};
const slotHTML=d=>esc(d.es).replace(/【(.*?)】/,'<span class="slot">$1</span>');
const mastery=id=>(S.d[id]||{}).ok||0;
function touch(id,f){const r=S.d[id]||(S.d[id]={n:0,ok:0,miss:0,at:0});f(r);r.at=now();save();}
function pool(){return DRILLS.filter(d=>d.L>=S.cfg.lo&&d.L<=S.cfg.hi&&(S.cfg.src!=="star"||S.star[d.id]));}
function weight(d){const r=S.d[d.id]||{};let w=(r.ok||0)>=3?1:3;if(d.L>=S.cfg.hi-1)w*=2;if((r.miss||0)>(r.ok||0))w*=1.5;if(S.star[d.id])w*=1.5;return w;}
function pickRounds(n){const p=pool();if(!p.length)return[];const out=[];let last=null;
  for(let i=0;i<n;i++){let tot=0;const ws=p.map(d=>{const w=d.id===last&&p.length>1?0:weight(d);tot+=w;return w;});
    let r=Math.random()*tot,j=0;while(j<p.length-1&&(r-=ws[j])>0)j++;
    const d=p[j];last=d.id;const m=mastery(d.id);
    const v=(m<2&&Math.random()<0.5)||!d.sw.length?-1:Math.floor(Math.random()*d.sw.length);
    out.push({id:d.id,v,full:m<3});}
  return out;}
function rangeHTML(){const opt=v=>LS.map(L=>`<option value="${L}"${L===v?" selected":""}>L${L}</option>`).join("");
  return `<div class="box"><div class="kv"><span>Lessons</span><span><select id="r-lo">${opt(S.cfg.lo)}</select> – <select id="r-hi">${opt(S.cfg.hi)}</select></span></div>
   <div class="kv"><span>Drills</span><span class="chips" id="r-src"><button data-v="all" class="${S.cfg.src==="all"?"on":""}">All</button><button data-v="star" class="${S.cfg.src==="star"?"on":""}">★ only</button></span></div>
   <div class="note" id="r-n"></div></div>`;}
function bindRange(re){$("#r-lo").onchange=e=>{S.cfg.lo=+e.target.value;if(S.cfg.hi<S.cfg.lo)S.cfg.hi=S.cfg.lo;save();re();};
  $("#r-hi").onchange=e=>{S.cfg.hi=+e.target.value;if(S.cfg.lo>S.cfg.hi)S.cfg.lo=S.cfg.hi;setLevel(Math.max(getLevel(),S.cfg.hi));save();re();};
  $$("#r-src button").forEach(b=>b.onclick=()=>{S.cfg.src=b.dataset.v;save();re();});
  const p=pool();$("#r-n").textContent=`${p.length} patterns · ${p.reduce((a,d)=>a+1+d.sw.length,0)} sentences. Newest lessons and shaky patterns come up more often.`;}

let TAB="manos";
$$("#tabs button").forEach(b=>b.onclick=()=>{halt();TAB=b.dataset.t;$$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render();});
function render(){({manos:rManos,tarjetas:rTarjetas,lista:rLista,ajustes:rAjustes})[TAB]();window.scrollTo(0,0);}

/* ---------- MANOS LIBRES ---------- */
let RUN=null; // {rounds,i,paused,token}
function halt(){if(RUN){RUN.token++;RUN=null;}stopSpeech();}
function rManos(){
  $("#main").innerHTML=rangeHTML()+`<div class="box"><p>Hear the English, <b>say it in Spanish out loud</b> in the gap, then hear the answer. New patterns play twice (slow, then normal); patterns you know switch to their swaps at full speed.</p>
   <div class="row" style="margin-top:12px"><button class="big pri" id="start" style="flex:1">▶ Start · ${S.cfg.rounds} rounds</button></div></div>`;
  bindRange(rManos);
  $("#start").onclick=()=>{const r=pickRounds(S.cfg.rounds);if(!r.length){toast("No drills in that range.");return;}
    RUN={rounds:r,i:0,paused:false,token:0};playScreen();runLoop();};}
function playScreen(){
  $("#main").innerHTML=`<div class="stage"><div class="phase" id="ph">Listen</div><div class="cue" id="cue"></div><div class="ans wait" id="ans">· · ·</div><div class="bar"><i id="bar"></i></div></div>
   <div class="ctl"><button id="pp">⏸</button><button id="nx">⏭</button><button id="st">■</button></div><p class="note" id="cnt" style="text-align:center"></p>`;
  $("#pp").onclick=()=>{if(!RUN)return;RUN.paused=!RUN.paused;$("#pp").textContent=RUN.paused?"▶":"⏸";
    if(RUN.paused){RUN.token++;stopSpeech();$("#ph").textContent="Paused";}else runLoop();};
  $("#nx").onclick=()=>{if(!RUN)return;RUN.token++;stopSpeech();RUN.i++;RUN.paused=false;$("#pp").textContent="⏸";runLoop();};
  $("#st").onclick=()=>{halt();rManos();};}
async function runLoop(){if(!RUN)return;const tok=++RUN.token,alive=()=>RUN&&RUN.token===tok&&!RUN.paused;
  while(RUN&&RUN.i<RUN.rounds.length){
    const R=RUN.rounds[RUN.i],d=D[R.id],f=fill(d,R.v);
    $("#cnt").textContent=`${RUN.i+1} / ${RUN.rounds.length} · L${d.L} ${d.t}`;
    $("#cue").innerHTML=esc(cueText(f.en))+(cueNote(f.en)?`<span class="note2">${esc(cueNote(f.en))}</span>`:"");
    $("#ans").textContent="· · ·";$("#ans").classList.add("wait");$("#ph").textContent="Listen";$("#bar").style.transition="none";$("#bar").style.width="0";
    await speak(cueText(f.en),"en",1);if(!alive())return;
    const gap=(2200+f.es.length*110)*S.cfg.gap;
    $("#ph").textContent="Your turn · say it";
    requestAnimationFrame(()=>{$("#bar").style.transition=`width ${gap}ms linear`;$("#bar").style.width="100%";});
    await wait(gap);if(!alive())return;
    $("#ph").textContent="Answer";$("#ans").textContent=f.es;$("#ans").classList.remove("wait");
    if(R.full){await speak(f.es,"es",Math.max(0.7,S.cfg.rate-0.17));if(!alive())return;await wait(500);if(!alive())return;}
    await speak(f.es,"es",S.cfg.rate);if(!alive())return;
    touch(d.id,r=>{r.n++;});
    await wait(900);if(!alive())return;
    RUN.i++;}
  if(RUN){const n=RUN.rounds.length;halt();$("#main").innerHTML=`<div class="box" style="text-align:center;padding:28px"><div style="font-size:40px">🎉</div><p style="margin-top:8px">¡Muy bien! ${n} rounds done.</p>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="pri" id="again">▶ Again</button><button id="tj">Tarjetas →</button></div></div>`;
    $("#again").onclick=()=>{const r=pickRounds(S.cfg.rounds);RUN={rounds:r,i:0,paused:false,token:0};playScreen();runLoop();};
    $("#tj").onclick=()=>$('[data-t="tarjetas"]').click();}}

/* ---------- TARJETAS ---------- */
let TQ=null,TT=0,TMISS=[];
function rTarjetas(){
  $("#main").innerHTML=rangeHTML()+`<div class="box"><p>Read the English, say the Spanish, then check. ✓ / ✗ teaches the app which patterns you own; Manos libres uses that to pick rounds.</p>
   <div class="row" style="margin-top:12px"><button class="big pri" id="go" style="flex:1">🔀 20 cards</button><button class="big" id="go2">All</button></div></div>`;
  bindRange(rTarjetas);
  const go=n=>{let items=[];pool().forEach(d=>{items.push({id:d.id,v:-1});d.sw.forEach((_,i)=>items.push({id:d.id,v:i}));});
    if(!items.length){toast("No drills in that range.");return;}
    shuffle(items);if(n)items=items.slice(0,n);TQ=items;TT=items.length;TMISS=[];tCard();};
  $("#go").onclick=()=>go(20);$("#go2").onclick=()=>go(0);}
function tCard(){if(!TQ.length)return tEnd();
  const it=TQ[0],d=D[it.id],f=fill(d,it.v);let shown=false;
  $("#main").innerHTML=`<div class="prog"><i style="width:${Math.round(100*(TT-TQ.length)/TT)}%"></i></div>
   <div class="card2" id="card"><div class="row" style="justify-content:space-between"><span class="phase">L${d.L} · ${esc(d.t)}</span><button class="star" id="st">${S.star[d.id]?"★":"☆"}</button></div>
   <div class="front"><div class="cue">${esc(cueText(f.en))}${cueNote(f.en)?`<span class="note2">${esc(cueNote(f.en))}</span>`:""}</div>
   <div class="ans wait" id="ans">· · ·</div></div>
   <div id="sb"><button class="big pri" style="width:100%" id="show">Show</button></div>
   <div id="gb" class="row hide"><button class="big" style="flex:1;border-color:var(--grana)" id="no">✗ Not yet</button><button class="big" style="flex:1;border-color:var(--verde)" id="yes">✓ Got it</button></div>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="ghost" id="q">End</button></div></div>`;
  const reveal=()=>{if(shown)return;shown=true;$("#ans").textContent=f.es;$("#ans").classList.remove("wait");$("#sb").classList.add("hide");$("#gb").classList.remove("hide");speak(f.es,"es",S.cfg.rate);};
  $("#show").onclick=reveal;$("#card").onclick=e=>{if(!e.target.closest("button"))reveal();};
  $("#ans").onclick=()=>shown&&speak(f.es,"es",S.cfg.rate);
  $("#st").onclick=e=>{e.stopPropagation();if(S.star[d.id])delete S.star[d.id];else S.star[d.id]=now();save();$("#st").textContent=S.star[d.id]?"★":"☆";};
  $("#no").onclick=()=>{stopSpeech();touch(d.id,r=>{r.miss++;r.n++;});TMISS.push(it);const x=TQ.shift();TQ.splice(Math.min(4,TQ.length),0,x);tCard();};
  $("#yes").onclick=()=>{stopSpeech();touch(d.id,r=>{r.ok++;r.n++;});TQ.shift();tCard();};
  $("#q").onclick=()=>{stopSpeech();TQ=[];tEnd();};}
function tEnd(){const uniq=[...new Map(TMISS.map(x=>[x.id+":"+x.v,x])).values()];
  $("#main").innerHTML=`<div class="box" style="text-align:center"><div style="font-size:40px">${uniq.length?"💪":"🎉"}</div><p>${TT} cards · ${uniq.length} to work on</p></div>
   ${uniq.length?`<div class="box">${uniq.map(x=>{const f=fill(D[x.id],x.v);return `<div class="d"><div class="es">${esc(f.es)}</div><div class="en">${esc(f.en)}</div></div>`;}).join("")}
   <div class="row" style="margin-top:10px"><button class="pri" id="again">Again, just these</button></div></div>`:""}
   <div class="row"><button id="back">Back</button></div>`;
  $("#back").onclick=rTarjetas;const a=$("#again");if(a)a.onclick=()=>{TQ=shuffle(uniq.slice());TT=TQ.length;TMISS=[];tCard();};}

const OPEN=new Set([Math.min(getLevel(),maxL)]);
function rLista(){
  $("#main").innerHTML=`<p class="note" style="margin:0 0 12px">Every pattern with its swaps. Tap a sentence (or a swap) to hear it. The red part is the slot that changes.</p>`+LS.map(L=>{
    const ds=DRILLS.filter(d=>d.L===L),open=OPEN.has(L),seen=ds.filter(d=>mastery(d.id)>=3).length;
    return `<div class="lesson"><div class="lh" data-l="${L}"><div class="t"><b>L${L} · ${esc((LESSONS[L]||[""])[0])}</b><div class="c">${ds.length} patterns · ${seen} solid</div></div><span class="dim">${open?"▾":"▸"}</span></div>
     ${open?`<div class="lb">${ds.map(d=>`<div class="d"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div>
       <div class="es" data-p="${d.id}|-1">${slotHTML(d)}</div><div class="en">${esc(d.en.replace(/\*/g,""))}</div></div>
       <div style="text-align:right"><button class="star" data-star="${d.id}">${S.star[d.id]?"★":"☆"}</button><div class="dots">${"●".repeat(Math.min(5,mastery(d.id)))}</div></div></div>
       <div class="sw">${d.sw.map((s,i)=>`<span data-p="${d.id}|${i}">${esc(s[0])}</span>`).join("")}</div></div>`).join("")}</div>`:""}</div>`;}).join("");
  $$("[data-l]").forEach(h=>h.onclick=()=>{const L=+h.dataset.l;OPEN.has(L)?OPEN.delete(L):OPEN.add(L);rLista();});
  $$("[data-p]").forEach(el=>el.onclick=()=>{const [id,v]=el.dataset.p.split("|");speak(fill(D[id],+v).es,"es",S.cfg.rate);});
  $$("[data-star]").forEach(b=>b.onclick=()=>{const id=b.dataset.star;if(S.star[id])delete S.star[id];else S.star[id]=now();save();b.textContent=S.star[id]?"★":"☆";});}

let resetArm=false;
function rAjustes(){const ids=Object.keys(S.d);
  $("#main").innerHTML=`<div class="box"><div class="kv"><span>Patterns practiced</span><b>${ids.length} / ${DRILLS.length}</b></div>
    <div class="kv"><span>Solid (3+ ✓ in Tarjetas)</span><b>${ids.filter(i=>mastery(i)>=3).length}</b></div></div>
   <div class="sec">Manos libres</div><div class="box">
    <div class="kv"><span>Thinking gap</span><span class="chips" id="c-gap">${[[0.8,"Short"],[1,"Normal"],[1.3,"Long"],[1.6,"Very long"]].map(([v,t])=>`<button data-v="${v}" class="${S.cfg.gap===v?"on":""}">${t}</button>`).join("")}</span></div>
    <div class="kv"><span>Rounds</span><span class="chips" id="c-rounds">${[10,16,24,40].map(v=>`<button data-v="${v}" class="${S.cfg.rounds===v?"on":""}">${v}</button>`).join("")}</span></div>
    <div class="kv"><span>Spanish speed</span><span class="chips" id="c-rate">${[0.8,0.95,1.05].map(v=>`<button data-v="${v}" class="${S.cfg.rate===v?"on":""}">${v}×</button>`).join("")}</span></div></div>
   <div class="sec">Audio</div><div class="box">${voiceUI(S.cfg)}</div>
   <div class="sec">Backup</div><div class="box">${backupUI()}</div>
   <div class="sec">Danger zone</div><div class="box"><button id="reset" style="border-color:var(--grana)">Reset all Habla progress</button><div class="note">Tap twice.</div></div>
   <p class="note">Habla · ${DRILLS.length} patterns · APPV ${APPV_NOW}</p>`;
  [["#c-gap","gap"],["#c-rounds","rounds"],["#c-rate","rate"]].forEach(([s,k])=>$$(s+" button").forEach(b=>b.onclick=()=>{S.cfg[k]=+b.dataset.v;save();rAjustes();}));
  bindVoiceUI(S.cfg,save);bindBackupUI([KEY,"hilo_level"],()=>{S.lastBackup=now();save();});
  $("#reset").onclick=()=>{if(!resetArm){resetArm=true;$("#reset").textContent="Tap again to erase";return;}S.d={};S.star={};save();resetArm=false;toast("Reset.");rAjustes();};}
const APPV_NOW="2026.11.22-1";
render();
})();
</script>
<script>
/* auto-updater (own key hiloUpdHabla) */
(function(){var APPV="2026.11.22-1";
try{if(sessionStorage.getItem("hiloUpdHabla")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("hiloUpdHabla",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
</body>
</html>
