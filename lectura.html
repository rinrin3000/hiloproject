<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17130f">
<title>Lectura — Hilo.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17130f;--card:#221c17;--card2:#2c241d;--line:#3a3028;--text:#f0e7d8;--dim:#9c8f7e;
  --grana:#d9574a;--anil:#7fa6d6;--oro:#e2a83f;--verde:#7fb36a;--gap:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;
  min-height:100vh;padding:0 var(--gap) 90px}
a{color:var(--anil)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;max-width:640px;margin:0 auto}
.pill{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px;color:var(--text);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:3px 13px 4px;background:var(--card)}
.pill b{color:var(--grana)}
.apptitle{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.tabs{display:flex;gap:6px;max-width:640px;margin:0 auto 14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
.tabs button.on{background:var(--grana);border-color:var(--grana);color:#fff}
main{max-width:640px;margin:0 auto}
button{background:var(--card2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
  padding:9px 14px;border-radius:999px;cursor:pointer}
button:active{border-color:var(--grana)}
button.big{font-size:16px;padding:13px 18px;border-radius:14px}
button.pri{background:var(--grana);border-color:var(--grana);color:#fff}
button.ghost{background:none}
button:disabled{opacity:.4}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sec{font-size:11px;color:var(--anil);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 8px}
.dim{color:var(--dim)}
.note{color:var(--dim);font-size:13px;line-height:1.7;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 11px;font-size:13px}
.chips button.on{border-color:var(--oro);color:var(--oro)}
.es{font-family:'Fraunces',Georgia,serif}
.tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.star{background:none;border:none;font-size:20px;color:var(--oro);padding:4px 8px}
select,textarea,input[type=number],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;max-width:100%}
textarea{width:100%;min-height:90px}
input[type=range]{width:100%;accent-color:var(--grana)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--oro);
  color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.hide{display:none!important}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
@media (max-width:420px){button{padding:8px 11px}.apptitle{font-size:19px}}

.lv{display:flex;align-items:center;gap:12px}
.lv b{font-family:'Fraunces',Georgia,serif;font-size:28px;color:var(--oro);min-width:56px}
.st{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:inherit;text-decoration:none;width:100%;text-align:left}
.st.later{opacity:.5}
.st .tt{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600}
.st .ab{font-size:13px;color:var(--dim);margin-top:3px}
.st .mt{font-size:12px;color:var(--anil);margin-top:6px}
.st .ok{color:var(--verde)}
/* reader */
#reader{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding:0 var(--gap) 140px}
.rtop{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);z-index:2;max-width:680px;margin:0 auto}
.rtop .ttl{flex:1;min-width:0;font-family:'Fraunces',Georgia,serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop button{padding:6px 10px;font-size:13px}
.rtop button.on{border-color:var(--oro);color:var(--oro)}
.txt{max-width:680px;margin:0 auto;padding-top:14px;font-family:'Fraunces',Georgia,serif;line-height:1.75}
.txt p{margin-bottom:16px}
.sn{border-radius:6px;transition:background .2s}
.sn.cur{background:rgba(226,168,63,.16)}
.sn.mk{box-shadow:inset 0 -2px 0 var(--oro)}
.spk{font-family:'Nunito Sans',sans-serif;font-size:.72em;color:var(--anil);font-weight:700;letter-spacing:.04em;margin-right:4px}
.tk{cursor:pointer;border-radius:4px}
.tk:active,.tk.sel{background:rgba(127,166,214,.25)}
.tk.gl{border-bottom:2px dotted var(--oro)}
.tr{display:block;font-family:'Nunito Sans',sans-serif;font-size:.68em;color:var(--dim);line-height:1.5;margin:2px 0 6px}
.dlg{display:block;margin-bottom:6px}
.pbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px var(--gap) calc(10px + env(safe-area-inset-bottom));z-index:21;display:flex;gap:8px;justify-content:center;align-items:center}
.pbar button{font-size:17px;padding:9px 14px}
.pbar .sp{font-size:13px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:2px solid var(--oro);border-radius:18px 18px 0 0;padding:16px var(--gap) calc(18px + env(safe-area-inset-bottom));z-index:30;max-height:70vh;overflow-y:auto}
.sheet .hw{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600}
.sheet .gl{font-size:16px;margin-top:2px}
.sheet .sen{font-family:'Fraunces',Georgia,serif;font-size:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sheet .row{margin-top:10px}
.sheet button{padding:7px 11px;font-size:13px}
.done-box{max-width:680px;margin:10px auto;text-align:center}
</style>
</head>
<body>
<div class="top"><a class="pill" href="index.html">Hilo<b>.</b></a><span class="apptitle">Lectura</span></div>
<main id="main"></main>
<script>
(function(){
/* ===== Hilo core (inlined into every app, inside the app's IIFE) ===== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=864e5, now=()=>Date.now();
const eod=()=>{const d=new Date();d.setHours(24,0,0,0);return d.getTime();};   // next local midnight
const sod=()=>eod()-DAY;
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||2200);}
function load(key,def){try{const v=JSON.parse(localStorage.getItem(key));return v&&typeof v==="object"?Object.assign(def,v):def;}catch(e){return def;}}
function store(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));return true;}catch(e){toast("Could not save progress (storage blocked?)");return false;}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* shared "my lesson" across the three apps */
function getLevel(){try{const v=parseInt(localStorage.getItem("hilo_level"));return v>0?v:1;}catch(e){return 1;}}
function setLevel(n){try{localStorage.setItem("hilo_level",String(n));}catch(e){}}

/* ===== robust TTS (Ito's 文型 engine, adapted for Spanish) ===== */
const TTSCFG={esURI:"",enURI:""};
let ESV=null,ENV=null,unlocked=false,speakToken=0,noEs=false,voicesSettled=false,currentU=null;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
const isEs=v=>v.lang.replace("_","-").toLowerCase().startsWith("es");
function pickVoices(){const vs=allVoices();
  const lat=v=>/es-(mx|us|419|co|ar|cl|pe)/i.test(v.lang.replace("_","-"));
  ESV=(TTSCFG.esURI&&vs.find(v=>v.voiceURI===TTSCFG.esURI))
    ||vs.find(v=>/Google/i.test(v.name)&&lat(v))
    ||vs.find(v=>/Paulina|Juan|Sabina|Dalia|Jorge/i.test(v.name)&&isEs(v))
    ||vs.find(v=>lat(v))||vs.find(v=>/Google/i.test(v.name)&&isEs(v))||vs.find(isEs)||null;
  ENV=(TTSCFG.enURI&&vs.find(v=>v.voiceURI===TTSCFG.enURI))
    ||vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>v.lang.startsWith("en"))||null;
  noEs=vs.length>0&&!ESV;}
async function ensureVoices(){for(let i=0;i<20;i++){if(allVoices().length)break;await new Promise(r=>setTimeout(r,120));}
  pickVoices();voicesSettled=true;}
function esWarnHTML(){return `<div class="box" id="es-warn" style="border-color:var(--grana)">
  ⚠ <b>No Spanish voice found in this browser.</b> Audio will be silent until one is installed.
  <div class="note">• <b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Spanish (Mexico) → <b>Paulina</b><br>
  • <b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage voices → Spanish<br>
  • <b>Windows:</b> Settings → Time &amp; Language → Language → add Español (México) with speech, or use Chrome/Edge<br>
  • <b>Android:</b> Settings → Google Text-to-speech → install Spanish<br>Then reload.</div></div>`;}
if(typeof speechSynthesis!=="undefined"){speechSynthesis.onvoiceschanged=()=>pickVoices();pickVoices();
  ensureVoices().then(()=>{const m=$("main");if(noEs&&m&&!$("#es-warn"))m.insertAdjacentHTML("afterbegin",esWarnHTML());});}
function unlock(){if(unlocked)return;unlocked=true;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("a");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener("touchstart",unlock,{once:true});
document.addEventListener("click",unlock,{once:true});
function stopSpeech(){speakToken++;try{speechSynthesis.cancel();}catch(e){}}
/* speak(text, "es"|"en", rate, {pitch}) → Promise resolved when done (or watchdog fires) */
function speak(text,lang="es",rate=0.95,opt={},_retry=false){
  const myToken=++speakToken, es=lang==="es";
  text=String(text).replace(/[—«»]/g," ").replace(/\s+/g," ").trim();
  if(!text)return Promise.resolve();
  return new Promise(async res=>{
    try{
      if(typeof speechSynthesis==="undefined")return res();
      if(!voicesSettled)await ensureVoices();
      const busy=speechSynthesis.speaking||speechSynthesis.pending;
      if(busy)speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken!==speakToken)return res();
        pickVoices();
        const u=new SpeechSynthesisUtterance(text);currentU=u;
        u.lang=es?(ESV?ESV.lang:"es-MX"):"en-US";
        let v=es?ESV:ENV,r=es?rate:1.0;
        if(_retry){r=1.0;if(es){const alt=allVoices().find(x=>isEs(x)&&v&&x.localService!==v.localService);if(alt)v=alt;}}
        if(v)u.voice=v;
        u.rate=Math.max(0.6,r);u.pitch=opt.pitch||1;
        let done=false,started=false;
        const kick=setInterval(()=>{try{speechSynthesis.resume()}catch(e){}},2500);
        const finish=()=>{if(done)return;done=true;clearInterval(kick);res();};
        u.onstart=()=>{started=true};u.onend=finish;u.onerror=finish;
        setTimeout(finish,600+text.length*(es?80:75)/u.rate+1500);
        setTimeout(()=>{if(!started&&!done&&!_retry){done=true;clearInterval(kick);try{speechSynthesis.cancel()}catch(e){}
          setTimeout(()=>speak(text,lang,1.0,opt,true).then(res),160);}},1400);
        speechSynthesis.speak(u);
        setTimeout(()=>{try{speechSynthesis.resume()}catch(e){}},120);
      },busy?230:40);
    }catch(e){res();}
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* voice settings block (rendered inside each app's settings tab) */
function voiceUI(cfg,saveFn){
  const vs=allVoices();
  const opts=(f,cur)=>`<option value="">Automatic</option>`+vs.filter(f).map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===cur?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  return `<div class="kv"><span>Spanish voice</span><select id="v-es">${opts(isEs,cfg.esURI)}</select></div>
   <div class="kv"><span>English voice</span><select id="v-en">${opts(v=>v.lang.startsWith("en"),cfg.enURI)}</select></div>
   <div class="row" style="margin-top:10px"><button id="v-test">🔊 Test</button><button id="v-reset">Reset audio</button></div>`;}
function bindVoiceUI(cfg,saveFn){
  const a=$("#v-es"),b=$("#v-en");if(!a)return;
  a.onchange=()=>{cfg.esURI=a.value;TTSCFG.esURI=a.value;saveFn();pickVoices();speak("Hola, ¿qué tal?","es");};
  b.onchange=()=>{cfg.enURI=b.value;TTSCFG.enURI=b.value;saveFn();pickVoices();speak("Hello!","en");};
  $("#v-test").onclick=()=>speak("Hola, me llamo Kenji. ¿Cómo te llamas?","es");
  $("#v-reset").onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}setTimeout(()=>speak("Listo.","es"),250);};}

/* ===== backup: copy / paste with per-app merge (shared with the hub) ===== */
const BKEYS=["palabras_v1","habla_v1","lectura_v1","hilo_level"];
const newer=(a,b)=>(!a?b:!b?a:((b.at||0)>(a.at||0)?b:a));
function mergeMapNewer(A,B){const o=Object.assign({},A||{});for(const k in (B||{}))o[k]=newer(o[k],B[k]);return o;}
function mergeKey(key,local,inc){
  if(key==="hilo_level")return Math.max(+local||1,+inc||1);
  if(!local)return inc; if(!inc)return local;
  const o=Object.assign({},local);
  if(key==="palabras_v1"){o.cards=mergeMapNewer(local.cards,inc.cards);o.miss=mergeMapNewer(local.miss,inc.miss);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="habla_v1"){o.d=mergeMapNewer(local.d,inc.d);o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="lectura_v1"){o.done=Object.assign({},inc.done||{},local.done||{});o.pos=mergeMapNewer(local.pos,inc.pos);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  return o;}
function exportJSON(keys){const out={hilo:1,at:new Date().toISOString(),keys:{}};
  keys.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)out.keys[k]=JSON.parse(v);}catch(e){}});return JSON.stringify(out);}
function importJSON(txt,keys){let d;try{d=JSON.parse(txt.trim());}catch(e){return "That doesn't look like a Hilo backup.";}
  if(!d||!d.keys)return "That doesn't look like a Hilo backup.";
  let n=0;keys.forEach(k=>{if(!(k in d.keys))return;let cur=null;try{cur=JSON.parse(localStorage.getItem(k));}catch(e){}
    const m=mergeKey(k,cur,d.keys[k]);try{localStorage.setItem(k,JSON.stringify(m));n++;}catch(e){}});
  return n?"":"Nothing in that backup belongs to this app.";}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}}
function backupUI(){return `<div class="row"><button id="bk-copy">📋 Copy progress</button><button id="bk-paste">📥 Paste progress</button></div>
  <div id="bk-area" class="hide" style="margin-top:10px"><textarea id="bk-text" placeholder="Paste a Hilo backup here"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" id="bk-go">Merge into this device</button><button id="bk-x">Cancel</button></div></div>
  <div class="note">Progress lives only in this browser. Copy it now and then (paste into a note or message to yourself) so a cleared browser or a new phone doesn't lose it. Pasting <b>merges</b>: the newer review of each card wins, nothing is deleted.</div>`;}
function bindBackupUI(keys,after){
  $("#bk-copy").onclick=async()=>{const t=exportJSON(keys);
    if(await copyText(t)){toast("Copied! Paste it somewhere safe.");after&&after("copied");}
    else{$("#bk-area").classList.remove("hide");$("#bk-text").value=t;$("#bk-text").select();toast("Select all and copy the text below.");}};
  $("#bk-paste").onclick=()=>{$("#bk-area").classList.remove("hide");$("#bk-text").value="";$("#bk-text").focus();};
  $("#bk-x").onclick=()=>$("#bk-area").classList.add("hide");
  $("#bk-go").onclick=()=>{const err=importJSON($("#bk-text").value,keys);if(err){toast(err);return;}
    toast("Merged ✓");setTimeout(()=>location.reload(),700);};}

const KEY="lectura_v1";
const S=load(KEY,{cfg:{},done:{},pos:{},star:{},lastBackup:0});
S.cfg=Object.assign({level:getLevel(),en:false,size:21,rate:0.9,cont:true,esURI:"",enURI:""},S.cfg||{});
TTSCFG.esURI=S.cfg.esURI;TTSCFG.enURI=S.cfg.enURI;
const save=()=>store(KEY,S);
const W={};WORDS.forEach(a=>W[a[0]]={id:a[0],d:a[1],en:a[2],k:a[3],L:a[4],n:a[5]});
const BYHW={};WORDS.forEach(a=>{const h=a[0].split("#")[0];(BYHW[h]=BYHW[h]||[]).push(a[0]);});
const MAXL=Math.max(...STORIES.map(s=>s.l));
const MALE=new Set(["Kenji","Mateo","Ernesto","Don Ernesto","Mesero","Vendedor"]);
window.__lectura={S};

/* ---------- library ---------- */
function rLib(){
  const lv=S.cfg.level,groups=[["Right for you now",s=>s.l<=lv&&s.l>=lv-2],["Review (easier)",s=>s.l<lv-2],["Later",s=>s.l>lv]];
  $("#main").innerHTML=`<div class="box"><div class="lv"><span class="dim" style="font-size:13px">I've studied up to</span><b>L${lv}</b>
     <input type="range" id="lvl" min="1" max="36" value="${lv}" style="flex:1"></div>
     <div class="note" style="margin-top:4px">L${lv}: ${esc((LESSONS[lv]||[""])[0])} — ${esc((LESSONS[lv]||["",""])[1])}</div></div>`+
   groups.map(([t,f])=>{const ss=STORIES.filter(f);if(!ss.length)return"";
     return `<div class="sec">${t}</div>`+ss.map(s=>{const n=s.p.reduce((a,p)=>a+p.length,0),pos=S.pos[s.id];
       return `<button class="st${s.l>lv?" later":""}" data-id="${s.id}"><div class="tt">${esc(s.title)}</div><div class="ab">${esc(s.en)} — ${esc(s.about)}</div>
       <div class="mt">L${s.l} · ${n} sentences${S.done[s.id]?' · <span class="ok">✓ read</span>':""}${pos&&!S.done[s.id]?` · 🔖 sentence ${pos.i+1}`:""}</div></button>`;}).join("");}).join("")+
   (S.cfg.level>MAXL?`<p class="note">Stories so far go up to L${MAXL}. More arrive with the A2 update.</p>`:"")+
   `<div class="sec">Settings</div><div class="box">
     <div class="kv"><span>Reading speed (audio)</span><span class="chips" id="c-rate">${[0.75,0.9,1].map(v=>`<button data-v="${v}" class="${S.cfg.rate===v?"on":""}">${v}×</button>`).join("")}</span></div>
     ${voiceUI(S.cfg)}</div><div class="sec">Backup</div><div class="box">${backupUI()}</div><p class="note">Lectura · ${STORIES.length} stories · APPV ${APPV_NOW}</p>`;
  $("#lvl").oninput=e=>{S.cfg.level=+e.target.value;setLevel(S.cfg.level);save();};
  $("#lvl").onchange=()=>rLib();
  $$(".st").forEach(b=>b.onclick=()=>openStory(b.dataset.id));
  $$("#c-rate button").forEach(b=>b.onclick=()=>{S.cfg.rate=+b.dataset.v;save();rLib();});
  bindVoiceUI(S.cfg,save);bindBackupUI([KEY,"hilo_level"],()=>{S.lastBackup=now();save();});}

/* ---------- reader ---------- */
let R=null; // {st, flat:[{s,pi}], cur, playing, token}
function openStory(id){const st=STORIES.find(s=>s.id===id);if(!st)return;
  const flat=[];st.p.forEach((p,pi)=>p.forEach(s=>flat.push({s,pi})));
  R={st,flat,cur:-1,playing:false,token:0};
  const el=document.createElement("div");el.id="reader";document.body.appendChild(el);document.body.style.overflow="hidden";
  drawReader();
  const pos=S.pos[id];if(pos&&pos.i>0&&!S.done[id]){toast(`Continuing from sentence ${pos.i+1}`);setTimeout(()=>scrollToSent(pos.i),80);}}
function sentHTML(x,i){const s=x.s;let h="",last=0;
  s.g.forEach(([a,b,lid])=>{h+=esc(s.es.slice(last,a));const gl=lid&&lid[0]==="!";
    h+=`<span class="tk${gl?" gl":""}" data-i="${i}" data-a="${a}">${esc(s.es.slice(a,b))}</span>`;last=b;});
  h+=esc(s.es.slice(last));
  const sk=`s:${R.st.id}:${s.es}`;
  return `<span class="sn${S.star[sk]?" mk":""}" id="s${i}">${s.sp?`<span class="spk">${esc(s.sp)}:</span>`:""}${h}</span>${S.cfg.en?`<span class="tr">${esc(s.en)}</span>`:" "}`;}
function drawReader(){const st=R.st;
  const paras=[];R.flat.forEach((x,i)=>{(paras[x.pi]=paras[x.pi]||[]).push([x,i]);});
  $("#reader").innerHTML=`<div class="rtop"><button id="r-back">←</button><div class="ttl">${esc(st.title)} <span class="dim">· L${st.l}</span></div>
    <button id="r-en" class="${S.cfg.en?"on":""}">EN</button><button id="r-sz">Aa</button></div>
   <div class="txt" style="font-size:${S.cfg.size}px">${paras.map(p=>{const dlg=p.some(([x])=>x.s.sp);
      return `<p>${p.map(([x,i])=>dlg?`<span class="dlg">${sentHTML(x,i)}</span>`:sentHTML(x,i)).join("")}</p>`;}).join("")}
   <div class="done-box">${S.done[st.id]?`<p class="dim">✓ Read on ${new Date(S.done[st.id]).toLocaleDateString()}</p>`:`<button class="big pri" id="r-done">✓ Finished reading</button>`}
   <p class="note">Tap any word for its meaning. Dotted gold = a word from beyond this level, explained in place.</p></div></div>
   <div class="pbar"><button id="p-prev">⏮</button><button id="p-play">▶</button><button id="p-next">⏭</button>
    <button class="sp" id="p-rate">${S.cfg.rate}×</button><button class="sp" id="p-mode">${S.cfg.cont?"All":"One"}</button></div>`;
  $("#r-back").onclick=closeReader;
  $("#r-en").onclick=()=>{S.cfg.en=!S.cfg.en;save();const y=$("#reader").scrollTop;drawReader();$("#reader").scrollTop=y;};
  $("#r-sz").onclick=()=>{S.cfg.size=S.cfg.size>=27?17:S.cfg.size+2;save();$(".txt").style.fontSize=S.cfg.size+"px";};
  const d=$("#r-done");if(d)d.onclick=()=>{S.done[st.id]=now();delete S.pos[st.id];save();toast("¡Muy bien! ✓");drawReader();};
  $$(".tk").forEach(t=>t.onclick=e=>{e.stopPropagation();openSheet(+t.dataset.i,+t.dataset.a,t);});
  $("#p-play").onclick=()=>R.playing?pause():play(R.cur<0?firstVisible():R.cur);
  $("#p-prev").onclick=()=>play(Math.max(0,(R.cur<0?0:R.cur)-1));
  $("#p-next").onclick=()=>play(Math.min(R.flat.length-1,(R.cur<0?0:R.cur)+1));
  $("#p-rate").onclick=()=>{S.cfg.rate=S.cfg.rate>=1?0.75:S.cfg.rate>=0.9?1:0.9;save();$("#p-rate").textContent=S.cfg.rate+"×";};
  $("#p-mode").onclick=()=>{S.cfg.cont=!S.cfg.cont;save();$("#p-mode").textContent=S.cfg.cont?"All":"One";};
  $("#reader").onclick=e=>{if(!e.target.closest(".sheet"))closeSheet();};
  if(R.cur>=0)mark(R.cur);}
function firstVisible(){const top=$("#reader").scrollTop+60;
  for(let i=0;i<R.flat.length;i++){const el=$("#s"+i);if(el&&el.offsetTop>=top)return i;}return 0;}
function scrollToSent(i){const el=$("#s"+i);if(el)$("#reader").scrollTo({top:el.offsetTop-90,behavior:"smooth"});}
function mark(i){$$(".sn.cur").forEach(x=>x.classList.remove("cur"));const el=$("#s"+i);if(el)el.classList.add("cur");}
function voiceFor(sp){if(!sp)return{};return{pitch:MALE.has(sp)?0.85:1.12};}
async function play(i){if(!R)return;const tok=++R.token;R.playing=true;$("#p-play").textContent="⏸";
  while(R&&R.token===tok&&i<R.flat.length){R.cur=i;mark(i);scrollToSent(i);
    S.pos[R.st.id]={i,at:now()};save();
    const s=R.flat[i].s;await speak(s.es,"es",S.cfg.rate,voiceFor(s.sp));
    if(!R||R.token!==tok)return;
    if(!S.cfg.cont)break;await wait(350);i++;}
  if(R&&R.token===tok){R.playing=false;$("#p-play").textContent="▶";}}
function pause(){if(!R)return;R.token++;R.playing=false;stopSpeech();$("#p-play").textContent="▶";}
function closeReader(){if(R){const i=R.cur>=0?R.cur:firstVisible();if(!S.done[R.st.id]&&i>0){S.pos[R.st.id]={i,at:now()};save();}R.token++;}
  stopSpeech();R=null;const el=$("#reader");if(el)el.remove();closeSheet();document.body.style.overflow="";rLib();}

/* ---------- word sheet ---------- */
function closeSheet(){const s=$(".sheet");if(s)s.remove();$$(".tk.sel").forEach(x=>x.classList.remove("sel"));}
function inPalabras(id){try{const p=JSON.parse(localStorage.getItem("palabras_v1"));return !!(p&&p.cards&&p.cards[id]);}catch(e){return false;}}
function addToPalabras(id){try{const p=JSON.parse(localStorage.getItem("palabras_v1"))||{};p.cards=p.cards||{};const t=now();
  if(!p.cards[id]){p.cards[id]={iv:0,e:2.5,r:0,due:t,at:t};p.cards[id+"|e"]={iv:0,e:2.5,r:0,due:eod()+1,at:t};}
  localStorage.setItem("palabras_v1",JSON.stringify(p));return true;}catch(e){return false;}}
function openSheet(i,a,el){closeSheet();el.classList.add("sel");
  const s=R.flat[i].s,seg=s.g.find(g=>g[0]===a),surf=s.es.slice(seg[0],seg[1]),lid=seg[2];
  let body="";
  if(lid&&lid[0]==="!")body=`<div class="hw">${esc(surf)}</div><div class="gl">${esc(lid.slice(1))}</div><div class="note">Beyond this level — just enjoy it.</div>`;
  else if(lid==="#")body=`<div class="hw">${esc(surf)}</div><div class="gl dim">a name or a number</div>`;
  else if(!lid||!W[lid])body=`<div class="hw">${esc(surf)}</div><div class="gl dim">(not in the word list)</div>`;
  else{const w=W[lid],sibs=(BYHW[lid.split("#")[0]]||[]).map(x=>W[x]);
    body=`<div class="row" style="justify-content:space-between;margin-top:0"><div class="hw">${esc(surf)}</div>
      <div><button id="sh-say">🔊</button></div></div>
      ${sibs.map(x=>`<div class="gl"><b class="es">${esc(x.d)}</b> — ${esc(x.en)} <span class="tag">L${x.L}</span></div>${x.n?`<div class="note" style="margin-top:2px">${esc(x.n)}</div>`:""}`).join("")}
      <div class="row">${inPalabras(w.id)?`<span class="dim" style="font-size:13px">✓ In Palabras</span>`:`<button id="sh-add">＋ Add to Palabras</button>`}</div>`;}
  const sk=`s:${R.st.id}:${s.es}`;
  const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=body+`<div class="sen">${esc(s.es)}<div class="note" style="margin-top:4px">${esc(s.en)}</div></div>
    <div class="row"><button id="sh-sent">🔊 Sentence</button><button id="sh-from">▶ From here</button><button id="sh-star">${S.star[sk]?"★ Saved":"☆ Save sentence"}</button><button id="sh-x">✕</button></div>`;
  document.body.appendChild(sh);sh.onclick=e=>e.stopPropagation();
  const say=$("#sh-say");if(say)say.onclick=()=>speak(surf,"es",S.cfg.rate);
  const add=$("#sh-add");if(add)add.onclick=()=>{if(addToPalabras(lid)){toast("Added to Palabras (new card)");add.outerHTML=`<span class="dim" style="font-size:13px">✓ In Palabras</span>`;}};
  $("#sh-sent").onclick=()=>speak(s.es,"es",S.cfg.rate,voiceFor(s.sp));
  $("#sh-from").onclick=()=>{closeSheet();play(i);};
  $("#sh-star").onclick=()=>{if(S.star[sk])delete S.star[sk];else S.star[sk]={at:now(),en:s.en};save();
    $("#sh-star").textContent=S.star[sk]?"★ Saved":"☆ Save sentence";const se=$("#s"+i);if(se)se.classList.toggle("mk",!!S.star[sk]);};
  $("#sh-x").onclick=closeSheet;}
const APPV_NOW="2026.11.22-1";
rLib();
})();
</script>
<script>
/* auto-updater (own key hiloUpdLectura) */
(function(){var APPV="2026.11.22-1";
try{if(sessionStorage.getItem("hiloUpdLectura")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("hiloUpdLectura",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
