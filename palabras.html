<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17130f">
<title>Palabras — Hilo.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17130f;--card:#221c17;--card2:#2c241d;--line:#3a3028;--text:#f0e7d8;--dim:#9c8f7e;
  --grana:#d9574a;--anil:#7fa6d6;--oro:#e2a83f;--verde:#7fb36a;--gap:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;
  min-height:100vh;padding:0 var(--gap) 90px}
a{color:var(--anil)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;max-width:640px;margin:0 auto}
.pill{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:20px;color:var(--text);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:3px 13px 4px;background:var(--card)}
.pill b{color:var(--grana)}
.apptitle{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.tabs{display:flex;gap:6px;max-width:640px;margin:0 auto 14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
.tabs button.on{background:var(--grana);border-color:var(--grana);color:#fff}
main{max-width:640px;margin:0 auto}
button{background:var(--card2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
  padding:9px 14px;border-radius:999px;cursor:pointer}
button:active{border-color:var(--grana)}
button.big{font-size:16px;padding:13px 18px;border-radius:14px}
button.pri{background:var(--grana);border-color:var(--grana);color:#fff}
button.ghost{background:none}
button:disabled{opacity:.4}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sec{font-size:11px;color:var(--anil);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 8px}
.dim{color:var(--dim)}
.note{color:var(--dim);font-size:13px;line-height:1.7;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 11px;font-size:13px}
.chips button.on{border-color:var(--oro);color:var(--oro)}
.es{font-family:'Fraunces',Georgia,serif}
.tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.star{background:none;border:none;font-size:20px;color:var(--oro);padding:4px 8px}
select,textarea,input[type=number],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;max-width:100%}
textarea{width:100%;min-height:90px}
input[type=range]{width:100%;accent-color:var(--grana)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--oro);
  color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
.hide{display:none!important}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
@media (max-width:420px){button{padding:8px 11px}.apptitle{font-size:19px}}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;min-height:300px;display:flex;flex-direction:column}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:10px 0}
.head{font-family:'Fraunces',Georgia,serif;font-size:36px;font-weight:600;line-height:1.2}
.gloss{font-size:21px;line-height:1.4}
.meta{font-size:12px;color:var(--dim)}
.back{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.exs{margin-top:10px}
.ex{padding:9px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex .s{font-family:'Fraunces',Georgia,serif;font-size:17px}
.ex .t{color:var(--dim);font-size:14px}
.ex button{padding:2px 8px;font-size:13px;margin-left:4px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.grades button{border-radius:12px;padding:10px 4px;font-size:13px;line-height:1.25}
.grades small{display:block;color:var(--dim);font-size:11px}
.g0{border-color:var(--grana)!important}.g3{border-color:var(--verde)!important}
.dirtag{font-size:11px;letter-spacing:.14em;color:var(--anil);text-transform:uppercase}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.lh .t{flex:1}
.lh .t b{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
.lh .c{font-size:12px;color:var(--dim)}
.lb{border-top:1px solid var(--line);padding:6px 10px 10px}
.w{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:none}
.w .x{flex:1;min-width:0}
.w .x .es{font-size:16px}
.w .x .en{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:4px}
.seg button{padding:5px 9px;font-size:13px;border-radius:9px}
.seg button.on{background:var(--anil);border-color:var(--anil);color:#111}
.seg button.know.on{background:var(--verde);border-color:var(--verde)}
.state{font-size:11px;color:var(--verde);white-space:nowrap}
.big-n{font-family:'Fraunces',Georgia,serif;font-size:44px;font-weight:700;color:var(--oro);line-height:1}
.stats{display:flex;gap:18px;justify-content:center;text-align:center;margin:6px 0 2px}
.stats div{font-size:12px;color:var(--dim)}
.stats b{display:block;font-size:22px;color:var(--text);font-family:'Fraunces',Georgia,serif}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--grana)}
</style>
</head>
<body>
<div class="top"><a class="pill" href="index.html">Hilo<b>.</b></a><span class="apptitle">Palabras</span></div>
<div class="tabs" id="tabs">
  <button data-t="hoy" class="on">Hoy</button><button data-t="lista">Lista</button><button data-t="flash">Flash</button><button data-t="ajustes">Ajustes</button>
</div>
<main id="main"></main>
<script>
(function(){
/* ===== Hilo core (inlined into every app, inside the app's IIFE) ===== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=864e5, now=()=>Date.now();
const eod=()=>{const d=new Date();d.setHours(24,0,0,0);return d.getTime();};   // next local midnight
const sod=()=>eod()-DAY;
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||2200);}
function load(key,def){try{const v=JSON.parse(localStorage.getItem(key));return v&&typeof v==="object"?Object.assign(def,v):def;}catch(e){return def;}}
function store(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));return true;}catch(e){toast("Could not save progress (storage blocked?)");return false;}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* shared "my lesson" across the three apps */
function getLevel(){try{const v=parseInt(localStorage.getItem("hilo_level"));return v>0?v:1;}catch(e){return 1;}}
function setLevel(n){try{localStorage.setItem("hilo_level",String(n));}catch(e){}}

/* ===== robust TTS (Ito's 文型 engine, adapted for Spanish) ===== */
const TTSCFG={esURI:"",enURI:""};
let ESV=null,ENV=null,unlocked=false,speakToken=0,noEs=false,voicesSettled=false,currentU=null;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
const isEs=v=>v.lang.replace("_","-").toLowerCase().startsWith("es");
function pickVoices(){const vs=allVoices();
  const lat=v=>/es-(mx|us|419|co|ar|cl|pe)/i.test(v.lang.replace("_","-"));
  ESV=(TTSCFG.esURI&&vs.find(v=>v.voiceURI===TTSCFG.esURI))
    ||vs.find(v=>/Google/i.test(v.name)&&lat(v))
    ||vs.find(v=>/Paulina|Juan|Sabina|Dalia|Jorge/i.test(v.name)&&isEs(v))
    ||vs.find(v=>lat(v))||vs.find(v=>/Google/i.test(v.name)&&isEs(v))||vs.find(isEs)||null;
  ENV=(TTSCFG.enURI&&vs.find(v=>v.voiceURI===TTSCFG.enURI))
    ||vs.find(v=>/Google/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>/Samantha|Jenny|Aria|Zira/i.test(v.name)&&v.lang.startsWith("en"))
    ||vs.find(v=>v.lang.startsWith("en"))||null;
  noEs=vs.length>0&&!ESV;}
async function ensureVoices(){for(let i=0;i<20;i++){if(allVoices().length)break;await new Promise(r=>setTimeout(r,120));}
  pickVoices();voicesSettled=true;}
function esWarnHTML(){return `<div class="box" id="es-warn" style="border-color:var(--grana)">
  ⚠ <b>No Spanish voice found in this browser.</b> Audio will be silent until one is installed.
  <div class="note">• <b>iPhone/iPad:</b> Settings → Accessibility → Spoken Content → Voices → Spanish (Mexico) → <b>Paulina</b><br>
  • <b>Mac:</b> System Settings → Accessibility → Spoken Content → System voice → Manage voices → Spanish<br>
  • <b>Windows:</b> Settings → Time &amp; Language → Language → add Español (México) with speech, or use Chrome/Edge<br>
  • <b>Android:</b> Settings → Google Text-to-speech → install Spanish<br>Then reload.</div></div>`;}
if(typeof speechSynthesis!=="undefined"){speechSynthesis.onvoiceschanged=()=>pickVoices();pickVoices();
  ensureVoices().then(()=>{const m=$("main");if(noEs&&m&&!$("#es-warn"))m.insertAdjacentHTML("afterbegin",esWarnHTML());});}
function unlock(){if(unlocked)return;unlocked=true;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("a");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener("touchstart",unlock,{once:true});
document.addEventListener("click",unlock,{once:true});
function stopSpeech(){speakToken++;try{speechSynthesis.cancel();}catch(e){}}
/* speak(text, "es"|"en", rate, {pitch}) → Promise resolved when done (or watchdog fires) */
function speak(text,lang="es",rate=0.95,opt={},_retry=false){
  const myToken=++speakToken, es=lang==="es";
  text=String(text).replace(/[—«»]/g," ").replace(/\s+/g," ").trim();
  if(!text)return Promise.resolve();
  return new Promise(async res=>{
    try{
      if(typeof speechSynthesis==="undefined")return res();
      if(!voicesSettled)await ensureVoices();
      const busy=speechSynthesis.speaking||speechSynthesis.pending;
      if(busy)speechSynthesis.cancel();
      setTimeout(()=>{
        if(myToken!==speakToken)return res();
        pickVoices();
        const u=new SpeechSynthesisUtterance(text);currentU=u;
        u.lang=es?(ESV?ESV.lang:"es-MX"):"en-US";
        let v=es?ESV:ENV,r=es?rate:1.0;
        if(_retry){r=1.0;if(es){const alt=allVoices().find(x=>isEs(x)&&v&&x.localService!==v.localService);if(alt)v=alt;}}
        if(v)u.voice=v;
        u.rate=Math.max(0.6,r);u.pitch=opt.pitch||1;
        let done=false,started=false;
        const kick=setInterval(()=>{try{speechSynthesis.resume()}catch(e){}},2500);
        const finish=()=>{if(done)return;done=true;clearInterval(kick);res();};
        u.onstart=()=>{started=true};u.onend=finish;u.onerror=finish;
        setTimeout(finish,600+text.length*(es?80:75)/u.rate+1500);
        setTimeout(()=>{if(!started&&!done&&!_retry){done=true;clearInterval(kick);try{speechSynthesis.cancel()}catch(e){}
          setTimeout(()=>speak(text,lang,1.0,opt,true).then(res),160);}},1400);
        speechSynthesis.speak(u);
        setTimeout(()=>{try{speechSynthesis.resume()}catch(e){}},120);
      },busy?230:40);
    }catch(e){res();}
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* voice settings block (rendered inside each app's settings tab) */
function voiceUI(cfg,saveFn){
  const vs=allVoices();
  const opts=(f,cur)=>`<option value="">Automatic</option>`+vs.filter(f).map(v=>`<option value="${esc(v.voiceURI)}"${v.voiceURI===cur?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  return `<div class="kv"><span>Spanish voice</span><select id="v-es">${opts(isEs,cfg.esURI)}</select></div>
   <div class="kv"><span>English voice</span><select id="v-en">${opts(v=>v.lang.startsWith("en"),cfg.enURI)}</select></div>
   <div class="row" style="margin-top:10px"><button id="v-test">🔊 Test</button><button id="v-reset">Reset audio</button></div>`;}
function bindVoiceUI(cfg,saveFn){
  const a=$("#v-es"),b=$("#v-en");if(!a)return;
  a.onchange=()=>{cfg.esURI=a.value;TTSCFG.esURI=a.value;saveFn();pickVoices();speak("Hola, ¿qué tal?","es");};
  b.onchange=()=>{cfg.enURI=b.value;TTSCFG.enURI=b.value;saveFn();pickVoices();speak("Hello!","en");};
  $("#v-test").onclick=()=>speak("Hola, me llamo Kenji. ¿Cómo te llamas?","es");
  $("#v-reset").onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}setTimeout(()=>speak("Listo.","es"),250);};}

/* ===== backup: copy / paste with per-app merge (shared with the hub) ===== */
const BKEYS=["palabras_v1","habla_v1","lectura_v1","hilo_level"];
const newer=(a,b)=>(!a?b:!b?a:((b.at||0)>(a.at||0)?b:a));
function mergeMapNewer(A,B){const o=Object.assign({},A||{});for(const k in (B||{}))o[k]=newer(o[k],B[k]);return o;}
function mergeKey(key,local,inc){
  if(key==="hilo_level")return Math.max(+local||1,+inc||1);
  if(!local)return inc; if(!inc)return local;
  const o=Object.assign({},local);
  if(key==="palabras_v1"){o.cards=mergeMapNewer(local.cards,inc.cards);o.miss=mergeMapNewer(local.miss,inc.miss);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="habla_v1"){o.d=mergeMapNewer(local.d,inc.d);o.star=Object.assign({},inc.star||{},local.star||{});}
  if(key==="lectura_v1"){o.done=Object.assign({},inc.done||{},local.done||{});o.pos=mergeMapNewer(local.pos,inc.pos);
    o.star=Object.assign({},inc.star||{},local.star||{});}
  return o;}
function exportJSON(keys){const out={hilo:1,at:new Date().toISOString(),keys:{}};
  keys.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)out.keys[k]=JSON.parse(v);}catch(e){}});return JSON.stringify(out);}
function importJSON(txt,keys){let d;try{d=JSON.parse(txt.trim());}catch(e){return "That doesn't look like a Hilo backup.";}
  if(!d||!d.keys)return "That doesn't look like a Hilo backup.";
  let n=0;keys.forEach(k=>{if(!(k in d.keys))return;let cur=null;try{cur=JSON.parse(localStorage.getItem(k));}catch(e){}
    const m=mergeKey(k,cur,d.keys[k]);try{localStorage.setItem(k,JSON.stringify(m));n++;}catch(e){}});
  return n?"":"Nothing in that backup belongs to this app.";}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}}
function backupUI(){return `<div class="row"><button id="bk-copy">📋 Copy progress</button><button id="bk-paste">📥 Paste progress</button></div>
  <div id="bk-area" class="hide" style="margin-top:10px"><textarea id="bk-text" placeholder="Paste a Hilo backup here"></textarea>
  <div class="row" style="margin-top:8px"><button class="pri" id="bk-go">Merge into this device</button><button id="bk-x">Cancel</button></div></div>
  <div class="note">Progress lives only in this browser. Copy it now and then (paste into a note or message to yourself) so a cleared browser or a new phone doesn't lose it. Pasting <b>merges</b>: the newer review of each card wins, nothing is deleted.</div>`;}
function bindBackupUI(keys,after){
  $("#bk-copy").onclick=async()=>{const t=exportJSON(keys);
    if(await copyText(t)){toast("Copied! Paste it somewhere safe.");after&&after("copied");}
    else{$("#bk-area").classList.remove("hide");$("#bk-text").value=t;$("#bk-text").select();toast("Select all and copy the text below.");}};
  $("#bk-paste").onclick=()=>{$("#bk-area").classList.remove("hide");$("#bk-text").value="";$("#bk-text").focus();};
  $("#bk-x").onclick=()=>$("#bk-area").classList.add("hide");
  $("#bk-go").onclick=()=>{const err=importJSON($("#bk-text").value,keys);if(err){toast(err);return;}
    toast("Merged ✓");setTimeout(()=>location.reload(),700);};}

const KEY="palabras_v1";
const S=load(KEY,{cards:{},star:{},miss:{},cfg:{},lastBackup:0});
S.cfg=Object.assign({dir:"both",auto:true,rate:0.9,gr:false,esURI:"",enURI:""},S.cfg||{});
TTSCFG.esURI=S.cfg.esURI;TTSCFG.enURI=S.cfg.enURI;
const save=()=>store(KEY,S);
const W={},ORDER={};WORDS.forEach((a,i)=>{W[a[0]]={id:a[0],d:a[1],en:a[2],k:a[3],L:a[4],n:a[5],ex:a[6]};ORDER[a[0]]=i;});
const BYHW={};WORDS.forEach(a=>{const h=a[0].split("#")[0];(BYHW[h]=BYHW[h]||[]).push(a[0]);});
const KN={n:"noun",a:"adjective",v:"verb",d:"adverb",x:"expression",g:"grammar word","#":"number",p:"place"};
const visible=w=>S.cfg.gr||w.k!=="g";
const EK=id=>id+"|e", isE=k=>k.endsWith("|e"), WID=k=>isE(k)?k.slice(0,-2):k;
const dirOn=k=>S.cfg.dir==="both"||(S.cfg.dir==="read")!==isE(k);
const spoken=w=>w.d.replace(/, -a$/,"").replace(/^el\/la /,"").replace(/ \/ /g,", ");
const sayWord=w=>speak(spoken(w),"es",S.cfg.rate);
const enCue=w=>w.en.replace(/\([^)]*\)/g,"").replace(/;/g,",").replace(/\s+/g," ").trim();
window.__palabras={S,W};

/* ---------- SRS ---------- */
function dueList(){const t=eod(),s0=sod(),rev=[],fresh=[];
  for(const k in S.cards){const c=S.cards[k],w=W[WID(k)];if(!w||!dirOn(k)||!visible(w))continue;if(c.due>=t)continue;
    const sib=S.cards[isE(k)?WID(k):EK(k)];
    if(sib&&dirOn(isE(k)?WID(k):EK(k))){
      if(sib.at>=s0&&sib.r>0&&!(c.at>=s0))continue;                       // sibling already reviewed today → bury
      if(isE(k)&&sib.due<t)continue;                                       // both due: reading card goes first
    }
    (c.r>0?rev:fresh).push(k);}
  rev.sort((a,b)=>S.cards[a].due-S.cards[b].due);
  fresh.sort((a,b)=>ORDER[WID(a)]-ORDER[WID(b)]||(isE(a)?1:-1));
  return rev.concat(fresh);}
function nextIv(c,g){const iv=c.iv||0;
  if(g===0)return 0; if(g===1)return iv?Math.max(1,iv*1.2):1;
  if(g===2)return iv?Math.max(iv+1,iv*c.e):1; return iv?Math.max(iv+2,iv*c.e*1.4):3;}
const fmtIv=d=>d<1?"<1m":d<30?Math.round(d)+"d":d<365?Math.round(d/30)+"mo":(d/365).toFixed(1)+"y";
function grade(k,g){const c=S.cards[k],t=now();c.r=(c.r||0)+1;c.at=t;
  if(g===0){c.iv=0;c.e=Math.max(1.6,(c.e||2.5)-0.2);c.due=t+60e3;
    const id=WID(k);S.miss[id]={n:((S.miss[id]||{}).n||0)+1,at:t};}
  else{const iv=nextIv(c,g);if(g===3)c.e=(c.e||2.5)+0.1;c.iv=iv;c.due=sod()+Math.round(iv)*DAY+Math.random()*36e5;
    const m=S.miss[WID(k)];if(m&&g>=2&&m.n>0){m.n--;m.at=t;}}
  save();}
function addWord(id,mode){const t=now();
  if(mode==="x"){delete S.cards[id];delete S.cards[EK(id)];save();return;}
  if(mode==="learn"){S.cards[id]={iv:0,e:2.5,r:0,due:t,at:t};S.cards[EK(id)]={iv:0,e:2.5,r:0,due:S.cfg.dir==="say"?t:eod()+1,at:t};}
  if(mode==="know"){const d=10+Math.random()*30;
    S.cards[id]={iv:d,e:2.6,r:1,due:sod()+Math.round(d)*DAY,at:t};
    const d2=Math.max(3,d*0.6*(0.8+Math.random()*0.2));S.cards[EK(id)]={iv:d2,e:2.5,r:1,due:sod()+Math.round(d2)*DAY,at:t};}
  save();}
const added=id=>!!S.cards[id];

/* ---------- tabs ---------- */
let TAB="hoy";
$$("#tabs button").forEach(b=>b.onclick=()=>{stopSpeech();TAB=b.dataset.t;$$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render();});
function render(){({hoy:rHoy,lista:rLista,flash:rFlash,ajustes:rAjustes})[TAB]();window.scrollTo(0,0);}

/* ---------- shared card body ---------- */
function exHTML(w){return `<div class="exs">${w.ex.map((e,i)=>`<div class="ex"><div class="s">${esc(e[0])}<button data-ex="${i}">🔊</button></div><div class="t">${esc(e[1])}</div></div>`).join("")}</div>`;}
function bindEx(w){$$("[data-ex]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();speak(w.ex[+b.dataset.ex][0],"es",S.cfg.rate);});}
function homographs(w){const ids=(BYHW[w.id.split("#")[0]]||[]).filter(x=>x!==w.id);
  return ids.length?`<div class="note">Same spelling: ${ids.map(x=>`<b>${esc(W[x].d)}</b> ${esc(W[x].en)}`).join(" · ")}</div>`:"";}
function starBtn(id){return `<button class="star" data-star="${esc(id)}">${S.star[id]?"★":"☆"}</button>`;}
function bindStar(){$$("[data-star]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.star;
  if(S.star[id])delete S.star[id];else S.star[id]=now();save();b.textContent=S.star[id]?"★":"☆";});}

/* ---------- HOY ---------- */
let Q=null,shown=false,sessionDone=0;
function rHoy(){Q=dueList();shown=false;
  const total=Object.keys(S.cards).filter(k=>!isE(k)).length;
  if(!Q.length){
    const nextDue=Object.values(S.cards).map(c=>c.due).filter(d=>d>=eod()).sort((a,b)=>a-b)[0];
    $("#main").innerHTML=`<div class="box" style="text-align:center;padding:30px 16px">
      ${total?`<div class="big-n">✓</div><p style="margin-top:12px">Nothing due right now${sessionDone?` · ${sessionDone} reviewed this session`:""}. ¡Muy bien!</p>
        ${nextDue?`<p class="note">Next review: ${new Date(nextDue).toLocaleDateString()}</p>`:""}`
      :`<p style="font-size:18px">No words yet.</p><p class="note">Open <b>Lista</b>, pick your lesson and tap <b>＋</b> on words you want to learn (or <b>✓</b> for ones you already know). Nothing enters your reviews until you add it.</p>`}
      <div class="row" style="justify-content:center;margin-top:16px"><button id="go-lista">Lista →</button><button id="go-flash">Flash →</button></div></div>`
      +backupNudge(total);
    $("#go-lista").onclick=()=>$('[data-t="lista"]').click();$("#go-flash").onclick=()=>$('[data-t="flash"]').click();
    bindNudge();return;}
  showCard();}
function backupNudge(total){if(total<30||now()-(S.lastBackup||0)<10*DAY)return "";
  return `<div class="box" style="border-color:var(--oro)">💾 You have ${total} words in progress. Time for a backup? <button id="nudge">Ajustes → Copy progress</button></div>`;}
function bindNudge(){const b=$("#nudge");if(b)b.onclick=()=>$('[data-t="ajustes"]').click();}
function showCard(){
  const k=Q[0],w=W[WID(k)],c=S.cards[k],say=isE(k);
  const rev=Q.filter(x=>S.cards[x].r>0).length,nw=Q.length-rev;
  $("#main").innerHTML=`<div class="stats"><div><b>${rev}</b>review</div><div><b>${nw}</b>new</div><div><b>${sessionDone}</b>done</div></div>
   <div class="card" id="card">
    <div class="row" style="justify-content:space-between"><span class="dirtag">${say?"Say it in Spanish":"What does it mean?"}</span>${starBtn(w.id)}</div>
    <div class="front">${say?`<div class="gloss">${esc(w.en)}</div><div class="meta">${KN[w.k]||""} · L${w.L}</div>`
      :`<div class="head es">${esc(w.d)}</div><div class="meta">${KN[w.k]||""} · L${w.L}${c.r===0?" · new":""}</div><button id="say1">🔊</button>`}</div>
    <div id="backside" class="hide back">
      ${say?`<div style="text-align:center"><div class="head es">${esc(w.d)}</div><button id="say2" style="margin-top:6px">🔊</button></div>`
        :`<div class="gloss" style="text-align:center">${esc(w.en)}</div>`}
      ${w.n?`<div class="note" style="text-align:center">${esc(w.n)}</div>`:""}${homographs(w)}${exHTML(w)}
    </div>
    <div id="showbtn" style="margin-top:14px"><button class="big pri" style="width:100%" id="show">Show answer</button></div>
    <div id="gradebtns" class="grades hide">${[["Otra vez","again",0],["Difícil","hard",1],["Bien","good",2],["Fácil","easy",3]].map(([a,b,g])=>
      `<button class="g${g}" data-g="${g}">${a}<small>${fmtIv(nextIv(c,g))}</small></button>`).join("")}</div>
   </div>`;
  bindStar();
  if(!say){$("#say1").onclick=()=>sayWord(w);if(S.cfg.auto)sayWord(w);}
  $("#show").onclick=reveal;
  $("#card").onclick=e=>{if(!shown&&!e.target.closest("button"))reveal();};
  function reveal(){if(shown)return;shown=true;$("#backside").classList.remove("hide");$("#showbtn").classList.add("hide");
    $("#gradebtns").classList.remove("hide");bindEx(w);if(say){$("#say2").onclick=()=>sayWord(w);if(S.cfg.auto)sayWord(w);}}
  $$("[data-g]").forEach(b=>b.onclick=e=>{e.stopPropagation();const g=+b.dataset.g;stopSpeech();grade(k,g);Q.shift();
    if(g===0)Q.splice(Math.min(3,Q.length),0,k);else sessionDone++;
    shown=false;if(Q.length)showCard();else rHoy();});
}

/* ---------- LISTA ---------- */
const OPEN=new Set([getLevel()]);let FIND="";
function lessonsPresent(){return [...new Set(WORDS.map(a=>a[4]))].sort((a,b)=>a-b);}
function rLista(){
  const Ls=lessonsPresent();
  $("#main").innerHTML=`<div class="row" style="margin-bottom:10px"><input type="text" id="find" placeholder="Search Spanish or English…" style="flex:1" value="${esc(FIND)}"></div>
   <div class="note" style="margin:0 0 12px">＋ = learn it (new card) · ✓ = I already know it (first review in 10–40 days) · ✕ = remove. Each word becomes two cards: <b>read</b> (Spanish → English) and <b>say</b> (English → Spanish).</div>
   <div id="lessons"></div>`;
  const draw=()=>{const f=FIND.toLowerCase().trim();
    $("#lessons").innerHTML=Ls.map(L=>{const ws=WORDS.filter(a=>a[4]===L&&visible(W[a[0]])).map(a=>W[a[0]])
        .filter(w=>!f||w.d.toLowerCase().includes(f)||w.en.toLowerCase().includes(f));
      if(f&&!ws.length)return "";
      const n=ws.filter(w=>added(w.id)).length,open=f||OPEN.has(L);
      return `<div class="lesson"><div class="lh" data-l="${L}"><div class="t"><b>L${L} · ${esc((LESSONS[L]||[""])[0])}</b><div class="c">${n}/${ws.length} added</div></div><span class="dim">${open?"▾":"▸"}</span></div>
       ${open?`<div class="lb"><div class="row" style="padding:6px 4px 8px"><button data-all="learn" data-les="${L}">＋ Learn all new</button><button data-all="know" data-les="${L}">✓ Know all new</button></div>
        ${ws.map(w=>{const c=S.cards[w.id];const st=c?(c.r===0?"new":"in "+fmtIv(Math.max(0,(c.due-now())/DAY))):"";
          return `<div class="w"><button class="ghost" data-say="${esc(w.id)}" style="padding:4px 6px">🔊</button>
          <div class="x"><div class="es">${esc(w.d)}${S.star[w.id]?" ★":""}</div><div class="en">${esc(w.en)}</div></div>
          ${st?`<span class="state">${st}</span>`:""}
          <div class="seg"><button data-a="learn" data-id="${esc(w.id)}" class="${c&&c.r===0?"on":""}">＋</button><button class="know ${c&&c.r>0?"on":""}" data-a="know" data-id="${esc(w.id)}">✓</button>${c?`<button data-a="x" data-id="${esc(w.id)}">✕</button>`:""}</div></div>`;}).join("")}</div>`:""}</div>`;}).join("")||`<p class="dim">No match.</p>`;
    $$("[data-l]").forEach(h=>h.onclick=()=>{const L=+h.dataset.l;OPEN.has(L)?OPEN.delete(L):OPEN.add(L);draw();});
    $$("[data-say]").forEach(b=>b.onclick=()=>sayWord(W[b.dataset.say]));
    $$("[data-a]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,a=b.dataset.a,c=S.cards[id];
      if(c&&((a==="learn"&&c.r===0)||(a==="know"&&c.r>0)))return; addWord(id,a);draw();});
    $$("[data-all]").forEach(b=>b.onclick=()=>{const L=+b.dataset.les;let n=0;
      WORDS.filter(a=>a[4]===L&&visible(W[a[0]])&&!added(a[0])).forEach(a=>{addWord(a[0],b.dataset.all);n++;});
      setLevel(Math.max(getLevel(),L));toast(n?`Added ${n} words`:"All words in this lesson are already added");draw();});};
  draw();
  $("#find").oninput=e=>{FIND=e.target.value;draw();};
}

/* ---------- FLASH (cram; never touches the schedule) ---------- */
const FC={lo:1,hi:getLevel(),src:"all",dir:"es",n:20,shuf:true};
let FQ=null,FNEED={},FMISS=new Set(),FSHOWN=false,FTOT=0;
function rFlash(){
  const Ls=lessonsPresent(),opt=(v)=>Ls.map(L=>`<option value="${L}"${L===v?" selected":""}>L${L}</option>`).join("");
  FC.hi=Math.min(Math.max(FC.hi,FC.lo),Ls[Ls.length-1]);
  $("#main").innerHTML=`<div class="box">
   <div class="kv"><span>Lessons</span><span><select id="f-lo">${opt(FC.lo)}</select> – <select id="f-hi">${opt(FC.hi)}</select></span></div>
   <div class="kv"><span>Words</span><span class="chips" id="f-src">${[["all","All"],["added","Added"],["hard","★ + tricky"]].map(([v,t])=>`<button data-v="${v}" class="${FC.src===v?"on":""}">${t}</button>`).join("")}</span></div>
   <div class="kv"><span>Direction</span><span class="chips" id="f-dir">${[["es","ES → EN"],["en","EN → ES"]].map(([v,t])=>`<button data-v="${v}" class="${FC.dir===v?"on":""}">${t}</button>`).join("")}</span></div>
   <div class="kv"><span>How many</span><span class="chips" id="f-n">${[10,20,50,0].map(v=>`<button data-v="${v}" class="${FC.n===v?"on":""}">${v||"All"}</button>`).join("")}</span></div>
   <div class="row" style="margin-top:14px"><button class="big pri" id="f-go" style="flex:1">🔀 Shuffle &amp; start</button><button class="big" id="f-go2">In order</button></div>
   <p class="note" id="f-count"></p></div>
   <p class="note">Flash is for cramming: it never changes your review schedule. ✗ sends a card back a few places and it needs two ✓ in a row to leave.</p>`;
  const pool=()=>WORDS.map(a=>W[a[0]]).filter(w=>visible(w)&&w.L>=FC.lo&&w.L<=FC.hi&&
    (FC.src==="all"||(FC.src==="added"&&added(w.id))||(FC.src==="hard"&&(S.star[w.id]||((S.miss[w.id]||{}).n>0)))));
  const upd=()=>{$("#f-count").textContent=pool().length+" words match.";};
  $("#f-lo").onchange=e=>{FC.lo=+e.target.value;if(FC.hi<FC.lo)FC.hi=FC.lo;rFlash();};
  $("#f-hi").onchange=e=>{FC.hi=+e.target.value;if(FC.lo>FC.hi)FC.lo=FC.hi;rFlash();};
  [["#f-src","src",String],["#f-dir","dir",String],["#f-n","n",Number]].forEach(([s,k,T])=>$$(s+" button").forEach(b=>b.onclick=()=>{FC[k]=T(b.dataset.v);rFlash();}));
  const go=sh=>{let p=pool();if(!p.length){toast("No words match.");return;}if(sh)shuffle(p);if(FC.n)p=p.slice(0,FC.n);
    FQ=p.map(w=>w.id);FNEED={};FMISS=new Set();FTOT=FQ.length;flashCard();};
  $("#f-go").onclick=()=>go(true);$("#f-go2").onclick=()=>go(false);upd();}
function flashCard(){
  if(!FQ.length)return flashEnd();
  const w=W[FQ[0]],en=FC.dir==="en";FSHOWN=false;
  const done=FTOT-new Set(FQ).size;
  $("#main").innerHTML=`<div class="prog"><i style="width:${Math.round(100*done/FTOT)}%"></i></div>
   <div class="card" id="card"><div class="row" style="justify-content:space-between"><span class="dirtag">Flash · ${done}/${FTOT}</span>${starBtn(w.id)}</div>
   <div class="front">${en?`<div class="gloss">${esc(w.en)}</div>`:`<div class="head es">${esc(w.d)}</div>`}<div class="meta">L${w.L}</div></div>
   <div id="backside" class="hide back" style="text-align:center">${en?`<div class="head es">${esc(w.d)}</div>`:`<div class="gloss">${esc(w.en)}</div>`}
     ${w.ex[0]?`<div class="ex" style="text-align:left"><div class="s">${esc(w.ex[0][0])}</div><div class="t">${esc(w.ex[0][1])}</div></div>`:""}</div>
   <div id="showbtn" style="margin-top:14px"><button class="big pri" style="width:100%" id="show">Show</button></div>
   <div id="fb" class="row hide" style="margin-top:14px"><button class="big" style="flex:1;border-color:var(--grana)" id="no">✗ Not yet</button><button class="big" style="flex:1;border-color:var(--verde)" id="yes">✓ Got it</button></div>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="ghost" id="fquit">End</button></div></div>`;
  bindStar();if(!en&&S.cfg.auto)sayWord(w);
  const reveal=()=>{if(FSHOWN)return;FSHOWN=true;$("#backside").classList.remove("hide");$("#showbtn").classList.add("hide");$("#fb").classList.remove("hide");if(en&&S.cfg.auto)sayWord(w);};
  $("#show").onclick=reveal;$("#card").onclick=e=>{if(!e.target.closest("button"))reveal();};
  $("#no").onclick=()=>{const id=FQ.shift();FMISS.add(id);FNEED[id]=2;FQ.splice(Math.min(3,FQ.length),0,id);
    S.miss[id]={n:((S.miss[id]||{}).n||0)+1,at:now()};save();flashCard();};
  $("#yes").onclick=()=>{const id=FQ.shift();if(FNEED[id]>1){FNEED[id]--;FQ.splice(Math.min(8,FQ.length),0,id);}flashCard();};
  $("#fquit").onclick=()=>{FQ=[];flashEnd();};}
function flashEnd(){const m=[...FMISS].map(id=>W[id]);
  $("#main").innerHTML=`<div class="box" style="text-align:center"><div class="big-n">${FTOT-m.length}/${FTOT}</div><p class="note">first-try ✓</p></div>
   ${m.length?`<div class="box"><div class="sec" style="margin-top:0">Missed</div>${m.map(w=>`<div class="w"><div class="x"><div class="es">${esc(w.d)}</div><div class="en">${esc(w.en)}</div></div>${starBtn(w.id)}</div>`).join("")}
   <div class="row" style="margin-top:12px"><button class="pri" id="again">🔀 Just the missed ones</button></div></div>`:""}
   <div class="row"><button id="back">Back to Flash</button></div>`;
  bindStar();$("#back").onclick=rFlash;
  const a=$("#again");if(a)a.onclick=()=>{FQ=shuffle(m.map(w=>w.id));FNEED={};FMISS=new Set();FTOT=FQ.length;flashCard();};}

/* ---------- AJUSTES ---------- */
let resetArm=false;
function rAjustes(){const ids=Object.keys(S.cards).filter(k=>!isE(k));
  const due=dueList().length,mat=ids.filter(k=>(S.cards[k].iv||0)>=21).length;
  $("#main").innerHTML=`<div class="box"><div class="stats"><div><b>${ids.length}</b>words added</div><div><b>${mat}</b>mature (21d+)</div><div><b>${due}</b>due today</div></div></div>
   <div class="sec">Reviews</div><div class="box">
    <div class="kv"><span>Card directions</span><span class="chips" id="c-dir">${[["both","Both"],["read","Read only"],["say","Say only"]].map(([v,t])=>`<button data-v="${v}" class="${S.cfg.dir===v?"on":""}">${t}</button>`).join("")}</span></div>
    <div class="kv"><span>Auto-play audio</span><span class="chips" id="c-auto"><button data-v="1" class="${S.cfg.auto?"on":""}">On</button><button data-v="0" class="${!S.cfg.auto?"on":""}">Off</button></span></div>
    <div class="kv"><span>Speech speed</span><span class="chips" id="c-rate">${[0.75,0.9,1].map(v=>`<button data-v="${v}" class="${S.cfg.rate===v?"on":""}">${v}×</button>`).join("")}</span></div>
    <div class="kv"><span>Show grammar words (el, de, y…)</span><span class="chips" id="c-gr"><button data-v="1" class="${S.cfg.gr?"on":""}">Show</button><button data-v="0" class="${!S.cfg.gr?"on":""}">Hide</button></span></div>
   </div>
   <div class="sec">Audio</div><div class="box">${voiceUI(S.cfg)}</div>
   <div class="sec">Backup</div><div class="box">${backupUI()}${S.lastBackup?`<div class="note">Last copied: ${new Date(S.lastBackup).toLocaleDateString()}</div>`:""}</div>
   <div class="sec">Danger zone</div><div class="box"><button id="reset" style="border-color:var(--grana)">Reset all Palabras progress</button><div class="note">Tap twice. Copy a backup first.</div></div>
   <p class="note">Palabras · ${WORDS.length} words · lessons ${lessonsPresent()[0]}–${lessonsPresent().slice(-1)[0]} · APPV <span id="appv"></span></p>`;
  [["#c-dir","dir",String],["#c-auto","auto",v=>v==="1"],["#c-rate","rate",Number],["#c-gr","gr",v=>v==="1"]].forEach(([s,k,T])=>
    $$(s+" button").forEach(b=>b.onclick=()=>{S.cfg[k]=T(b.dataset.v);save();rAjustes();}));
  bindVoiceUI(S.cfg,save);
  bindBackupUI([KEY,"hilo_level"],()=>{S.lastBackup=now();save();});
  $("#reset").onclick=()=>{if(!resetArm){resetArm=true;$("#reset").textContent="Tap again to erase everything";return;}
    S.cards={};S.star={};S.miss={};save();resetArm=false;toast("Reset.");rAjustes();};
  $("#appv").textContent=APPV_NOW;}
const APPV_NOW="2026.11.22-1";
render();
})();
</script>
<script>
/* auto-updater: fetch a fresh copy (cache-bypassed); if the server's APPV differs, navigate to it. Own key hiloUpdPalabras. */
(function(){var APPV="2026.11.22-1";
try{if(sessionStorage.getItem("hiloUpdPalabras")===APPV)return;}catch(e){}
fetch(location.pathname+"?vc="+Date.now(),{cache:"no-store"})
 .then(function(r){return r.ok?r.text():""})
 .then(function(t){var m=t&&t.match(/APPV="([^"]+)"/);
   if(m&&m[1]!==APPV){try{sessionStorage.setItem("hiloUpdPalabras",m[1]);}catch(e){}
     location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));}})
 .catch(function(){});})();
</script>
</body>
